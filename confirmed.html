<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Email confirmed · Nook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1611;
    --card: #241d17;
    --amber: #e0a45e;
    --amber-soft: rgba(224, 164, 94, 0.14);
    --cream: #f3ebdf;
    --muted: #a3978a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .brand {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.5px;
    color: var(--amber);
    margin-bottom: 40px;
  }
  .check-ring {
    width: 92px;
    height: 92px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: var(--amber-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg.check { width: 46px; height: 46px; }
  .check circle {
    stroke: var(--amber);
    stroke-width: 4;
    fill: none;
    stroke-dasharray: 166;
    stroke-dashoffset: 166;
    animation: draw 0.6s ease-out 0.25s forwards;
  }
  .check path {
    stroke: var(--amber);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 48;
    stroke-dashoffset: 48;
    animation: draw 0.4s ease-out 0.75s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.2;
    margin-bottom: 14px;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 320px;
    margin: 0 auto;
  }
  .hint {
    margin-top: 34px;
    font-size: 14px;
    color: var(--muted);
    opacity: 0.75;
  }
  .hint b { color: var(--cream); font-weight: 600; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">Nook</div>
    <div class="check-ring">
      <svg class="check" viewBox="0 0 60 60" aria-hidden="true">
        <circle cx="30" cy="30" r="26.5"></circle>
        <path d="M18 31 L26.5 39.5 L43 22"></path>
      </svg>
    </div>
    <h1>Your email is confirmed</h1>
    <p>You're all set. Head back to the Nook app and sign in to begin.</p>
    <div class="hint">You can close this page and open <b>Nook</b>.</div>
  </main>
</body>
</html>
